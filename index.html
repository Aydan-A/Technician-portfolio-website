<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Coffee Machine Tech is a technical portfolio for espresso machine diagnostics, grinder calibration, repair case studies, and workshop writing."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..600&display=swap"
      rel="stylesheet"
    />
    <!-- Dark is the default theme; the light value applies once a visitor
         switches, because the toggle sets data-theme on <html>. -->
    <meta name="theme-color" content="#181A1F" />
    <title>Coffee Machine Tech | Engineering & Repair</title>
    <!-- Resolve the theme before first paint: dark unless this visitor has
         switched to light. Without this, a returning light-theme visitor sees
         a dark flash while the React app mounts. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('theme') === 'light') theme = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
